<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dnormal</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f242e; --line:#2a313d;
    --txt:#e6e9ef; --mut:#8b94a3; --acc:#27ae60; --acch:#229954;
    --err:#e74c3c; --warn:#e67e22; --info:#3498db;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .sp{flex:1}
  header .who{color:var(--mut);font-size:13px}
  header .qstat{color:var(--mut);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
  button:hover{background:var(--acch)} button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  button.danger{background:var(--err)} button.danger:hover{background:#c0392b}
  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  /* login */
  .login{max-width:340px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}
  .login h2{margin:0 0 16px;font-size:18px}
  .login input{width:100%;margin-bottom:10px;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--txt)}
  .login button{width:100%} .err{color:var(--err);font-size:13px;min-height:18px;margin-top:6px}
  /* viewers */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h3{margin:0;padding:12px 14px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);color:var(--mut);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
  .card h3 .sp{flex:1}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:14px;max-height:58vh;overflow:auto}
  .tile{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .tile img{width:100%;height:120px;object-fit:cover;background:#0a0c10;display:block}
  .tile .meta{padding:8px;display:flex;flex-direction:column;gap:6px}
  .tile .name{font-size:11px;color:var(--mut);word-break:break-all;line-height:1.3}
  .tile button{padding:5px 8px;font-size:12px;width:100%}
  .empty{padding:24px;color:var(--mut);text-align:center;font-size:13px}
  .chip{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;letter-spacing:.02em}
  .chip.READY{background:#223; color:var(--info); border:1px solid var(--info)}
  .chip.QUEUED{background:#2a2410;color:var(--warn);border:1px solid var(--warn)}
  .chip.PROCESSING{background:#2a2410;color:var(--warn);border:1px solid var(--warn)}
  .chip.HAS_NORMAL{background:#16241a;color:var(--acc);border:1px solid var(--acc)}
  .chip.ERROR{background:#2a1416;color:var(--err);border:1px solid var(--err)}
  /* logs */
  .logs{margin-top:16px;background:#0a0c10;border:1px solid var(--line);border-radius:10px}
  .logs h3{margin:0;padding:10px 14px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  pre{margin:0;padding:12px 14px;max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;color:#b8c0cc;white-space:pre-wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
  .dot.ok{background:var(--acc)} .dot.bad{background:var(--err)}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:320px}
  .toast.show{opacity:1}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:380px}
  .modal h4{margin:0 0 8px;font-size:16px}
  .modal p{color:var(--mut);font-size:13px;margin:0 0 16px}
  .modal .row{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
  <div class="login">
    <h2>dnormal</h2>
    <input id="identity" placeholder="email" autocomplete="username" />
    <input id="password" type="password" placeholder="contraseña" autocomplete="current-password" />
    <button id="loginBtn">Entrar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" style="display:none">
  <header>
    <h1>dnormal</h1>
    <span class="dot" id="hdot" title="estado PocketBase"></span>
    <div class="sp"></div>
    <span class="qstat" id="qstat">cola: —</span>
    <span class="who" id="who"></span>
    <button class="ghost" id="logoutBtn">Salir</button>
  </header>
  <div class="wrap">
    <div class="bar">
      <button id="refreshBtn" class="ghost">Refrescar</button>
      <button id="autoBtn" class="danger" title="Procesa TODAS las texturas sin normal">⚠ Auto-procesar todo</button>
    </div>
    <div class="cols">
      <div class="card">
        <h3>Mis texturas (albedo)<span class="sp"></span></h3>
        <div class="grid" id="texGrid"><div class="empty">Cargando…</div></div>
      </div>
      <div class="card">
        <h3>Normales convertidas<span class="sp"></span>
          <button id="delAllBtn" class="danger" style="padding:4px 8px;font-size:11px">⚠ Borrar todas</button>
        </h3>
        <div class="grid" id="normGrid"><div class="empty">—</div></div>
      </div>
    </div>
    <div class="logs">
      <h3><span class="dot" id="ldot"></span> Logs</h3>
      <pre id="logBox">—</pre>
    </div>
  </div>
</div>

<!-- MODAL confirmación peligrosa -->
<div class="modal" id="modal">
  <div class="box">
    <h4 id="mTitle">¿Seguro?</h4>
    <p id="mText"></p>
    <div class="row">
      <button class="ghost" id="mCancel">Cancelar</button>
      <button class="danger" id="mOk">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let TOKEN=null, USER=null, POLL=null;

function authHeaders(){ return { "Authorization":"Bearer "+TOKEN }; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function confirmDanger(title,text){ return new Promise(res=>{
  $("#mTitle").textContent=title; $("#mText").textContent=text; $("#modal").classList.add("show");
  const ok=$("#mOk"),cancel=$("#mCancel");
  const done=v=>{ $("#modal").classList.remove("show"); ok.onclick=null; cancel.onclick=null; res(v); };
  ok.onclick=()=>done(true); cancel.onclick=()=>done(false);
}); }

async function login(){
  $("#loginErr").textContent="";
  const identity=$("#identity").value.trim(), password=$("#password").value;
  if(!identity||!password){ $("#loginErr").textContent="Completá email y contraseña"; return; }
  $("#loginBtn").disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity,password})});
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.detail||"Login fallido"); }
    const d=await r.json(); TOKEN=d.token; USER=d.user;
    sessionStorage.setItem("dn_token",TOKEN); sessionStorage.setItem("dn_user",JSON.stringify(USER));
    enterApp();
  }catch(err){ $("#loginErr").textContent=err.message; }
  finally{ $("#loginBtn").disabled=false; }
}
function logout(){ sessionStorage.clear(); TOKEN=null; USER=null; if(POLL)clearInterval(POLL);
  $("#appView").style.display="none"; $("#loginView").style.display="block"; }

function enterApp(){
  $("#loginView").style.display="none"; $("#appView").style.display="block";
  $("#who").textContent=USER.email||USER.name||USER.id;
  loadTextures(); refreshLogs(); checkHealth();
  if(POLL)clearInterval(POLL);
  POLL=setInterval(()=>{ if(TOKEN){ refreshLogs(); pollQueue(); } },4000);
}

async function checkHealth(){
  try{ const r=await fetch("/api/health"); $("#hdot").className="dot "+(r.ok?"ok":"bad"); }
  catch{ $("#hdot").className="dot bad"; }
}

let lastQueueBusy=false;
async function pollQueue(){
  try{
    const r=await fetch("/api/queue",{headers:authHeaders()});
    if(r.status===401){ logout(); return; }
    const q=await r.json();
    const busy=(q.pending||0)+(q.PROCESSING||0)+(q.QUEUED||0);
    $("#qstat").textContent=`cola: ${q.QUEUED||0} en espera · ${q.PROCESSING||0} procesando · ${q.ERROR||0} error`;
    // si había cola y se vació, refrescamos los visores
    if(lastQueueBusy && busy===0) loadTextures();
    lastQueueBusy = busy>0;
  }catch{}
}

async function loadTextures(){
  try{
    const r=await fetch("/api/textures",{headers:authHeaders()});
    if(r.status===401){ logout(); return; }
    const d=await r.json(); renderTextures(d.items||[]);
  }catch{ $("#texGrid").innerHTML='<div class="empty">Error al cargar</div>'; }
}

function imgTile(filename){
  const img=document.createElement("img"); img.loading="lazy";
  fetch("/api/file/"+encodeURIComponent(filename),{headers:authHeaders()})
    .then(res=>res.ok?res.blob():Promise.reject()).then(b=>img.src=URL.createObjectURL(b)).catch(()=>{});
  return img;
}

function texTile(it){
  const div=document.createElement("div"); div.className="tile";
  div.appendChild(imgTile(it.texture));
  const meta=document.createElement("div"); meta.className="meta";
  const chip=document.createElement("span"); chip.className="chip "+it.state;
  chip.textContent={READY:"sin normal",QUEUED:"en cola",PROCESSING:"procesando…",HAS_NORMAL:"✓ con normal",ERROR:"error"}[it.state]||it.state;
  meta.appendChild(chip);
  const nm=document.createElement("div"); nm.className="name"; nm.textContent=it.texture; meta.appendChild(nm);
  if(it.state==="READY"||it.state==="ERROR"){
    const b=document.createElement("button"); b.textContent=it.state==="ERROR"?"Reintentar":"Generar normal";
    b.onclick=()=>enqueue(it.texture,b); meta.appendChild(b);
  }
  if(it.state==="ERROR" && it.error){ const e=document.createElement("div"); e.className="name"; e.style.color="var(--err)"; e.textContent=it.error; meta.appendChild(e); }
  div.appendChild(meta); return div;
}

function normTile(it){
  const div=document.createElement("div"); div.className="tile";
  div.appendChild(imgTile(it.normal));
  const meta=document.createElement("div"); meta.className="meta";
  const nm=document.createElement("div"); nm.className="name"; nm.textContent=it.normal; meta.appendChild(nm);
  const sub=document.createElement("div"); sub.className="name"; sub.style.opacity=".7"; sub.textContent="de "+it.texture; meta.appendChild(sub);
  const b=document.createElement("button"); b.className="danger"; b.textContent="Borrar";
  b.onclick=()=>delNormal(it.normal,b); meta.appendChild(b);
  div.appendChild(meta); return div;
}

function renderTextures(items){
  const tg=$("#texGrid"), ng=$("#normGrid"); tg.innerHTML=""; ng.innerHTML="";
  if(!items.length){ tg.innerHTML='<div class="empty">No tenés texturas subidas</div>'; ng.innerHTML='<div class="empty">—</div>'; return; }
  let norms=0, processable=0;
  for(const it of items){
    tg.appendChild(texTile(it));
    if(it.has_normal){ ng.appendChild(normTile(it)); norms++; }
    if(it.state==="READY"||it.state==="ERROR") processable++;
  }
  if(!norms) ng.innerHTML='<div class="empty">Todavía no hay normales</div>';
  $("#autoBtn").disabled = processable===0;
  $("#delAllBtn").disabled = norms===0;
}

async function enqueue(filename,btn){
  if(btn){ btn.disabled=true; btn.textContent="Encolando…"; }
  try{
    const r=await fetch("/api/enqueue",{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify({filename})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"Error");
    toast("Encolada: "+filename); loadTextures(); pollQueue();
  }catch(err){ toast("✗ "+err.message); loadTextures(); }
}

async function autoProcess(){
  if(!await confirmDanger("⚠ Auto-procesar todo","Esto encola TODAS tus texturas que no tienen normal. Puede generar muchos archivos en PocketBase. ¿Continuar?")) return;
  try{
    const r=await fetch("/api/auto-process",{method:"POST",headers:authHeaders()});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"Error");
    toast(`Encoladas ${d.queued} texturas`); loadTextures(); pollQueue();
  }catch(err){ toast("✗ "+err.message); }
}

async function delNormal(filename,btn){
  if(!await confirmDanger("Borrar normal","Se borrará "+filename+" de PocketBase. ¿Continuar?")) return;
  if(btn){ btn.disabled=true; btn.textContent="Borrando…"; }
  try{
    const r=await fetch("/api/normals/delete",{method:"POST",headers:{...authHeaders(),"Content-Type":"application/json"},body:JSON.stringify({filename})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"Error");
    toast("Normal borrada"); loadTextures();
  }catch(err){ toast("✗ "+err.message); loadTextures(); }
}

async function delAll(){
  if(!await confirmDanger("⚠ Borrar TODAS las normales","Se borrarán todas tus normales de PocketBase. Esto no se puede deshacer. ¿Continuar?")) return;
  try{
    const r=await fetch("/api/normals/delete-all",{method:"POST",headers:authHeaders()});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.detail||"Error");
    toast(`Borradas ${d.deleted} normales`); loadTextures();
  }catch(err){ toast("✗ "+err.message); }
}

async function refreshLogs(){
  try{ const r=await fetch("/api/logs?lines=200"); const t=await r.text();
    const box=$("#logBox"); box.textContent=t||"(sin logs)"; $("#ldot").className="dot ok"; box.scrollTop=box.scrollHeight;
  }catch{ $("#ldot").className="dot bad"; }
}

$("#loginBtn").onclick=login;
$("#password").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
$("#refreshBtn").onclick=()=>{ loadTextures(); refreshLogs(); checkHealth(); pollQueue(); };
$("#autoBtn").onclick=autoProcess;
$("#delAllBtn").onclick=delAll;
$("#logoutBtn").onclick=logout;

(function(){
  const t=sessionStorage.getItem("dn_token"), u=sessionStorage.getItem("dn_user");
  if(t&&u){ TOKEN=t; USER=JSON.parse(u); enterApp(); }
})();
</script>
</body>
</html>
