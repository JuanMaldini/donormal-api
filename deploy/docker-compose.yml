# Solo para correr el worker en tu maquina antes de pushear.
#
# En la VPS esto NO se usa: Dokploy buildea deploy/Dockerfile directo (para un
# contenedor unico, "Application + Dockerfile" alcanza) y las variables se
# cargan en su panel, en Environment.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Sin `ports`  : el worker no recibe trafico, solo sale.
# Sin `volumes`: no guarda nada. Las normales se generan en RAM y van directo a
#                PocketBase; los logs van a stdout.

services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: clothfigurator-normal-worker:latest
    container_name: normal-worker
    env_file: ../.env
    restart: unless-stopped
